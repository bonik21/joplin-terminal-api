services:
  joplin-terminal-api:
    image: bonik21/joplin-terminal-api:latest
    # Change the image tag above if you need a different version/channel.
    # Examples:
    #   bonik21/joplin-terminal-api:latest          - latest Joplin + joplin-terminal-api-stable
    #   bonik21/joplin-terminal-api:dev             - latest Joplin + joplin-terminal-api-dev
    #   bonik21/joplin-terminal-api:3.7.1           - 3.7.1 Joplin + joplin-terminal-api-stable
    #   bonik21/joplin-terminal-api:3.7.1-dev       - 3.7.1 Joplin + joplin-terminal-api-dev
    container_name: joplin-terminal-api
    restart: unless-stopped
    ports:
      - "41185:41185"
      # [Optional] Uncomment if you use OneDrive as sync target (OAuth redirect port)
      # - "9967:9967"
    env_file:
      - .env
    volumes:
      - ./joplin-data:/root/.config/joplin
