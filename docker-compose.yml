services:
  joplin-terminal-api:
    image: bonik21/joplin-terminal-api:latest
    # For dev branch: bonik21/joplin-terminal-api:dev (or bonik21/joplin-terminal-api:<version>-dev)
    # For specific Joplin version: bonik21/joplin-terminal-api:<version> (e.g. 3.7.1)
    container_name: joplin-terminal-api
    restart: unless-stopped
    ports:
      - "41185:41185"
      # [Optional] Uncomment if you use OneDrive as sync target (OAuth redirect port)
      # - "9967:9967"
    env_file:
      - .env
    volumes:
      - ./joplin-data:/root/.config/joplin
